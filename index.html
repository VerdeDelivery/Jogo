<!doctype html>
<html lang="pt-BR">
<head>


<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#080d1b"/>
<title>Subway Run</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="boot" role="status" aria-live="polite"><div class="by">SUBWAY RUN • CARREGANDO</div>
<div class="bootCreditLabel">DESIGN</div>
<div class="av"><div><img id="bootImg" alt="Foto de perfil de Ivad" referrerpolicy="no-referrer" src="https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/ef7bfb18128bb2b969e297ab6d013b5f~tplv-tiktokx-cropcenter:100:100.jpeg?dr=14579&refresh_token=a85d6a5f&x-expires=1793311200&x-signature=VrhEPuqiZyUDaG57P7%2B8ceTKBNM%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=my2"><b id="bootLetter" style="display:none">I</b></div></div>
<h1>IVAD</h1><div class="at">@ivad.lives</div>
<div class="bar"><i id="bootBar"></i></div><div class="pc" id="bootPc">0%</div><div class="bootLoadingNote">Preparando seu mundo...</div></div>
<style>
/* Ajustes isolados da tela de carregamento */
#boot{gap:0;overflow:hidden}
#boot::before{content:"";position:absolute;width:min(78vw,430px);aspect-ratio:1;border:1px solid #7cecff20;border-radius:50%;box-shadow:0 0 0 26px #7cecff08,0 0 0 58px #ff5c8a06;animation:bootOrbit 12s linear infinite;pointer-events:none}
#boot::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ffffff06 45%,transparent 65%);transform:translateX(-100%);animation:bootSweep 3.8s ease-in-out infinite;pointer-events:none}
#boot>*{position:relative;z-index:1}
#boot .by{font-size:10px;letter-spacing:.25em;margin-bottom:17px;color:#9beaff;animation:bootTextGlow 2.4s ease-in-out infinite}
#boot .bootCreditLabel{font:900 10px/1 system-ui,sans-serif;letter-spacing:.28em;color:#ffd21f;margin-bottom:9px;text-shadow:0 0 15px #ffd21f55}
#boot .av{width:96px;height:96px;padding:4px;box-shadow:0 0 25px #4ff0ff55,0 0 44px #ff5c8a22;animation:bootSpin 5s linear infinite}
#boot .av>div{animation:bootSpin 5s linear infinite reverse}
#boot .av b{font-size:42px}
#boot h1{font-size:36px;margin:15px 0 4px;letter-spacing:.12em}
#boot .at{font-size:14px}
#boot .bar{margin-top:30px;width:min(260px,70vw);height:10px}
#boot .pc{font-size:13px;margin-top:9px}
#boot .bootLoadingNote{font:600 10px/1.4 system-ui,sans-serif;letter-spacing:.12em;color:#b8d9ef;opacity:.8;margin-top:15px;animation:bootPulse 1.5s ease-in-out infinite}
@keyframes bootOrbit{to{transform:rotate(360deg)}}
@keyframes bootSweep{0%,15%{transform:translateX(-100%)}65%,100%{transform:translateX(100%)}}
@keyframes bootTextGlow{0%,100%{opacity:.75}50%{opacity:1;text-shadow:0 0 12px #4ff0ff99}}
@keyframes bootPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media(max-height:600px){#boot .by{margin-bottom:8px}#boot .av{width:78px;height:78px}#boot h1{font-size:30px;margin-top:9px}#boot .bar{margin-top:18px}#boot .bootLoadingNote{margin-top:8px}}
</style>
<script>
/* Carregamento: sobe até 100% e então abre o menu principal do jogo.
   Foto do criador: coloque o arquivo "perfil.jpg" na mesma pasta deste HTML (ou troque o caminho em src acima). */
(function () {
  var boot = document.getElementById('boot'), bar = document.getElementById('bootBar'), pc = document.getElementById('bootPc'), img = document.getElementById('bootImg'), letter = document.getElementById('bootLetter');
  var imgDone = false, pageDone = false, fontsDone = false, t0 = performance.now(), MIN = 2300, shown = 0, finished = false;
  // A foto e o crédito de design definidos nesta tela são fixos para esta versão.
  img.onload = function () { imgDone = true; }; var tried = false; img.onerror = function () { if (!tried) { tried = true; img.src = 'perfil.jpg'; return; } imgDone = true; img.style.display = 'none'; letter.style.display = 'block'; }; // se o link falhar, tenta perfil.jpg e por fim a letra I
  if (img.complete) { if (img.naturalWidth) imgDone = true; else if (img.src) img.onerror(); }
  addEventListener('load', function () { pageDone = true; });
  if (document.readyState === 'complete') pageDone = true;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { fontsDone = true; }, function () { fontsDone = true; });
  setTimeout(function () { imgDone = pageDone = fontsDone = true; }, 7000); // segurança: nunca trava
  function tick() {
    var ready = imgDone && pageDone && fontsDone, el = performance.now() - t0;
    var target = Math.min(100, el / MIN * 100); if (!ready) target = Math.min(target, 92);
    shown += (target - shown) * .25; if (target - shown < .4) shown = target;
    var v = Math.floor(shown); bar.style.width = shown + '%'; pc.textContent = v + '%';
    if (shown >= 99.9 && ready && !finished) { finished = true; bar.style.width = '100%'; pc.textContent = '100%'; setTimeout(function () { boot.classList.add('out'); setTimeout(function () { boot.remove(); }, 700); }, 300); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
<canvas id="c"></canvas>
<div class="hud"><div id="score">0</div><div id="coins">🪙 0</div><button id="pauseBtn" aria-label="Pausar">II</button></div>
<div id="timer"></div>
<div id="fps" class="hudi">-- FPS</div>
<div id="tvWrap" class="tvWrap p-tv" aria-label="Telão voador"><div class="tvFloat"><svg class="thr l" viewbox="0 0 30 78" aria-hidden="true"><defs><lineargradient id="thG1" x1="0" x2="1"><stop offset="0" stop-color="#6b7aa8"/><stop offset=".5" stop-color="#eef3ff"/><stop offset="1" stop-color="#5c6a98"/></lineargradient></defs><path class="fl1" d="M15 38C4 48 8 64 15 78C22 64 26 48 15 38Z" fill="#ff7a1a"/><path class="fl2" d="M15 38C9 46 11 58 15 66C19 58 21 46 15 38Z" fill="#ffe15a"/><rect x="6" y="2" width="18" height="26" rx="6" fill="url(#thG1)" stroke="#14172e" stroke-width="2"/><path d="M8 28H22L26 38H4Z" fill="#434d78" stroke="#14172e" stroke-width="2"/><rect x="9" y="8" width="12" height="3" rx="1.5" fill="#55a7ff"/></svg><svg class="thr r" viewbox="0 0 30 78" aria-hidden="true"><defs><lineargradient id="thG2" x1="0" x2="1"><stop offset="0" stop-color="#6b7aa8"/><stop offset=".5" stop-color="#eef3ff"/><stop offset="1" stop-color="#5c6a98"/></lineargradient></defs><path class="fl1" d="M15 38C4 48 8 64 15 78C22 64 26 48 15 38Z" fill="#ff7a1a"/><path class="fl2" d="M15 38C9 46 11 58 15 66C19 58 21 46 15 38Z" fill="#ffe15a"/><rect x="6" y="2" width="18" height="26" rx="6" fill="url(#thG2)" stroke="#14172e" stroke-width="2"/><path d="M8 28H22L26 38H4Z" fill="#434d78" stroke="#14172e" stroke-width="2"/><rect x="9" y="8" width="12" height="3" rx="1.5" fill="#55a7ff"/></svg><div class="tvFrame"><div id="tvScreen" class="tvScreen"><div class="tvEmpty"><b>📺</b>Sem vídeo<br/>Adicione um link do YouTube<br/>nas configurações</div></div></div></div></div>
<div id="ov"><div class="card" id="card"></div></div>


<script type="module" src="app.js?v=13"></script>
</body>
</html>
